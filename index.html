<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share your delivery location</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b141a; color: #e9edef; padding: 24px;
  }
  .card {
    max-width: 440px; width: 100%; text-align: center;
    background: #111b21; border-radius: 20px; padding: 32px 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { font-size: 15px; line-height: 1.5; color: #aebac1; margin: 0 0 20px; }
  .who {
    background: #202c33; border-radius: 12px; padding: 14px 16px;
    margin: 0 0 22px; text-align: left; font-size: 15px; line-height: 1.5;
  }
  .who .lbl { color: #8696a0; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .who .val { color: #e9edef; font-weight: 600; }
  label { display:block; text-align:left; font-size:13px; color:#8696a0; margin:0 0 6px; }
  input {
    width:100%; padding:13px 14px; margin:0 0 16px; border-radius:10px;
    border:1px solid #2a3942; background:#202c33; color:#e9edef; font-size:16px;
  }
  button {
    width: 100%; border: 0; border-radius: 30px; padding: 16px;
    font-size: 17px; font-weight: 600; cursor: pointer;
    background: #25D366; color: #062b12;
  }
  button.sec { background:#2a3942; color:#e9edef; margin-top:10px; }
  button:disabled { opacity: .6; cursor: default; }
  .pin { font-size: 48px; margin-bottom: 12px; }
  .status { margin-top: 18px; font-size: 14px; min-height: 20px; }
  .err { color: #f6a5a5; }
  .banner {
    display:none; background:#3a2a00; color:#ffd479; border:1px solid #5c4400;
    border-radius:12px; padding:16px; margin:0 0 20px; text-align:left; font-size:14px; line-height:1.55;
  }
  .banner b { color:#ffe6a3; }
  .banner ol { margin:10px 0 0; padding-left:20px; }
  .banner li { margin:4px 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="pin">📍</div>
    <h1>Share your delivery location</h1>
    <p>Tap the button below. Your phone will ask permission, then open WhatsApp with your location ready to send to our team.</p>

    <div class="banner" id="banner">
      <b>⚠️ Please open this in your browser first.</b><br>
      Location doesn't work inside WhatsApp. To fix it:
      <ol id="bannerSteps"></ol>
      <button class="sec" id="copyBtn" style="margin-top:14px;">Copy link instead</button>
    </div>

    <div class="who" id="whoBox" style="display:none;"></div>

    <div id="manualFields" style="display:none;">
      <label for="mName">Your name</label>
      <input id="mName" type="text" placeholder="e.g. John Smith" autocomplete="name">
      <label for="mRef">Order / reference number</label>
      <input id="mRef" type="text" placeholder="e.g. ORD-5521">
    </div>

    <button id="go">Share my location</button>
    <div class="status" id="status"></div>
  </div>

<script>
  // ====== SETTINGS ======
  const WHATSAPP_NUMBER = "26774703132";   // team number, digits only
  // ======================

  const params = new URLSearchParams(window.location.search);
  let custName = (params.get("name") || "").trim();
  let orderRef = (params.get("ref") || "").trim();

  const whoBox = document.getElementById("whoBox");
  const manual = document.getElementById("manualFields");
  const btn = document.getElementById("go");
  const status = document.getElementById("status");
  const banner = document.getElementById("banner");

  // Detect in-app browsers (WhatsApp, Facebook, Instagram, etc.) that block GPS
  const ua = navigator.userAgent || "";
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const inApp = /(WhatsApp|FBAN|FBAV|FB_IAB|Instagram|Line|Twitter|; wv\))/i.test(ua);

  if (inApp) {
    const steps = document.getElementById("bannerSteps");
    if (isAndroid) {
      steps.innerHTML =
        "<li>Tap the <b>⋮</b> menu (top-right corner).</li>" +
        "<li>Choose <b>Open in browser</b> (or Open in Chrome).</li>" +
        "<li>Then tap <b>Share my location</b>.</li>";
    } else if (isIOS) {
      steps.innerHTML =
        "<li>Tap the <b>Share</b> / <b>⋯</b> icon (top or bottom).</li>" +
        "<li>Choose <b>Open in Safari</b>.</li>" +
        "<li>Then tap <b>Share my location</b>.</li>";
    } else {
      steps.innerHTML = "<li>Open this link in your normal browser, then tap <b>Share my location</b>.</li>";
    }
    banner.style.display = "block";
  }

  if (custName || orderRef) {
    let html = "";
    if (custName) html += '<div class="lbl">Customer</div><div class="val">' + esc(custName) + '</div>';
    if (orderRef) html += '<div class="lbl" style="margin-top:10px;">Order / reference</div><div class="val">' + esc(orderRef) + '</div>';
    whoBox.innerHTML = html;
    whoBox.style.display = "block";
  } else {
    manual.style.display = "block";
  }

  document.getElementById("copyBtn").addEventListener("click", function () {
    const url = window.location.href;
    navigator.clipboard.writeText(url).then(
      () => { this.textContent = "Link copied ✓ — paste in Chrome/Safari"; },
      () => { this.textContent = url; }
    );
  });

  btn.addEventListener("click", function () {
    if (manual.style.display === "block") {
      custName = document.getElementById("mName").value.trim();
      orderRef = document.getElementById("mRef").value.trim();
    }
    if (!("geolocation" in navigator)) {
      showError("This phone/browser doesn't support location sharing.");
      return;
    }
    btn.disabled = true;
    status.textContent = "Getting your location…";

    navigator.geolocation.getCurrentPosition(
      function (pos) {
        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);
        const maps = "https://maps.google.com/?q=" + lat + "," + lng;

        let msg = "📍 Delivery location";
        if (custName) msg += "\nCustomer: " + custName;
        if (orderRef) msg += "\nOrder: " + orderRef;
        msg += "\n" + maps;

        const wa = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msg);
        status.textContent = "Opening WhatsApp…";
        window.location.href = wa;
      },
      function (err) {
        if (err.code === 1) {
          // Permission denied — almost always the in-app browser
          banner.style.display = "block";
          if (!document.getElementById("bannerSteps").innerHTML) {
            document.getElementById("bannerSteps").innerHTML =
              "<li>Open this link in <b>Chrome</b> or <b>Safari</b> (not inside WhatsApp).</li>" +
              "<li>Allow location when asked, then tap <b>Share my location</b>.</li>";
          }
          showError("Location was blocked. Please open this link in your browser (see steps above), then try again.");
        } else if (err.code === 2) {
          showError("Location unavailable. Turn on GPS / Location on your phone and try again.");
        } else if (err.code === 3) {
          showError("Timed out. Please try again.");
        } else {
          showError("Couldn't get your location. Please try again.");
        }
        btn.disabled = false;
        btn.textContent = "Try again";
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });

  function esc(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function showError(m){ status.innerHTML = '<span class="err">' + m + '</span>'; }
</script>
</body>
</html>
